services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked at build time (Dockerfile ARGs)
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?Set_NEXT_PUBLIC_API_URL_in_.env}"
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:?Set_NEXT_PUBLIC_SUPABASE_URL_in_.env}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set_NEXT_PUBLIC_SUPABASE_ANON_KEY_in_.env}"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Set_NEXT_PUBLIC_API_URL_in_.env}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?Set_NEXT_PUBLIC_SUPABASE_URL_in_.env}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set_NEXT_PUBLIC_SUPABASE_ANON_KEY_in_.env}
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - APP_URL=${APP_URL:?Set_APP_URL_in_.env}
      - SUPABASE_URL=${SUPABASE_URL:?Set_SUPABASE_URL_in_.env}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?Set_SUPABASE_SERVICE_ROLE_KEY_in_.env}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MEM0_API_KEY=${MEM0_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - REDIS_URL=${REDIS_URL:?Set_REDIS_URL_in_.env}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - MAX_SUMMARIES_PER_RUN=${MAX_SUMMARIES_PER_RUN:-20}
      - MAX_SEARCHES_PER_DAY_PER_USER=${MAX_SEARCHES_PER_DAY_PER_USER:-100}
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-false}
      - DATABASE_URL=${DATABASE_URL:?Set_DATABASE_URL_in_.env}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
