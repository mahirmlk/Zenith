name: CI

# PR gate (update.md §16): lint/type/test/build on every PR and push.
# Manual dispatch kept for on-demand full runs.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: './backend/pyproject.toml'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # mypy strict is aspirational — track debt in docs/STATUS.md, don't gate PRs
      - run: mypy .
        continue-on-error: true
      - run: pytest
      - name: AI eval smoke (update.md §10)
        working-directory: .
        run: python evals/runners/run_evals.py

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20']
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
