name: CI

# PR gate (update.md §16): lint/type/test/build on every PR and push.
# Manual dispatch kept for on-demand full runs.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy .
      - run: uv run --locked pytest
      - name: AI eval smoke (update.md §10)
        working-directory: .
        run: uv run --project backend --locked python evals/runners/run_evals.py
      - name: Watchlist notification eval (update.md §12)
        working-directory: .
        run: uv run --project backend --locked python evals/runners/run_watchlist_evals.py

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20']
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Compose expects a local env file for runtime configuration. Image builds
      # need no production secrets, so supply an empty file on clean CI runners.
      - name: Create secret-free Compose env file
        run: touch .env
      - name: Validate production Compose configuration
        env:
          APP_URL: https://app.example.invalid
          DATABASE_URL: postgresql://ci:ci@example.invalid:5432/zenith
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://project.example.invalid
          REDIS_URL: redis://redis.example.invalid:6379/0
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_URL: https://project.example.invalid
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build Docker images
        run: docker compose build
