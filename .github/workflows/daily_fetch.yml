name: Daily Paper Ingestion

# The daily schedule is disabled to avoid GitHub Actions costs.
# Scheduled ingestion still runs on the Fly.io cron machine (see backend/fly.toml);
# this workflow is kept for manual dispatches only.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily ingestion
        run: |
          curl -fsS -X POST \
            "${{ secrets.BACKEND_URL }}/api/internal/ingest" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            --max-time 30
