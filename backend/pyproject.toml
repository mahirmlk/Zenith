[project]
name = "ai-paper-agent-backend"
version = "0.1.0"
description = "FastAPI backend for AI Paper Research Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.8.0",
    "supabase>=2.10.0",
    "langgraph>=1.0.10,<2.0.0",
    "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "mem0ai>=0.1.0",
    "firecrawl-py>=1.8.0",
    "arxiv>=2.1.0",
    "numpy>=2.1.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "langfuse>=2.51.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "python-multipart>=0.0.20",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff==0.15.12",
    "mypy>=1.13.0",
    "types-redis>=4.6",
]

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = '(^|/)(tests|scripts)/'

[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "slowapi.util.*",
    "supabase.*",
    "mem0.*",
    "firecrawl.*",
    "langfuse.callback",
    "arxiv.*",
    "sse_starlette.*",
]
ignore_missing_imports = true
