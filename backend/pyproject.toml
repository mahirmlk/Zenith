[project]
name = "ai-paper-agent-backend"
version = "0.1.0"
description = "FastAPI backend for AI Paper Research Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.8.0",
    "supabase>=2.10.0",
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "mem0ai>=0.1.0",
    "firecrawl-py>=1.8.0",
    "arxiv>=2.1.0",
    "numpy>=2.1.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "langfuse>=2.51.0",
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=5.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "slowapi.util.*",
    "supabase.*",
    "mem0.*",
    "firecrawl.*",
    "langchain_mistralai.*",
    "arxiv.*",
    "sse_starlette.*",
    "langfuse.*",
    "sentry_sdk.*",
    "backend.config",
    "backend.services.embeddings",
    "backend.services.arxiv",
    "backend.services.huggingface",
    "backend.agents.summary_agent",
    "backend.models.schemas",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
    "services.run_store",
    "services.mem0_client",
    "services.arxiv",
    "services.huggingface",
    "services.semantic_scholar",
    "services.papers_with_code",
    "services.firecrawl",
    "services.retry",
    "services.jwt_validator",
    "services.citation_cache",
    "services.ingestion",
    "services.observability",
    "services.llm_router",
    "agents.*",
    "models.schemas",
    "dependencies",
]
ignore_errors = true
